<!DOCTYPE html>
<html>
<head>
    <title>Marquee Examples</title>
</head>
<body>

    <h2>Marquee Tag</h2>
    <p>Use: The &lt;marquee&gt; tag makes its content move automatically (scroll/slide/bounce).</p>
    <p>Attributes used: behavior, direction.</p>

    <h3>1. Moving Text</h3>
    <marquee behavior="scroll" direction="left">
        This text is moving from right to left!
    </marquee>

    <h3>2. Moving Image</h3>
    <marquee behavior="alternate" direction="right">
        <img src="sample.jpg" alt="Moving Image" width="150" height="100">
    </marquee>

    <h3>3. Moving Hyperlink</h3>
    <marquee behavior="scroll" direction="up">
        <a href="home.html">Click here to go Home (this link is moving)</a>
    </marquee>

    <hr>

    <p><a href="home.html">⬅ Back to Home Page</a></p>

</body>
</html>
