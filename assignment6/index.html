<html>
<head>
    <title>Assignment 6 - Registration Form</title>
</head>
<body bgcolor="#f5f5dc">
    <h2 align="center">Student Registration Form for Admission</h2>

    <form align="center">
        <table border="0" align="center">
            <tr>
                <td>Student Name:</td>
                <td><input type="text" name="sname" size="25"></td>
            </tr>
            <tr>
                <td>Father's Name:</td>
                <td><input type="text" name="fname" size="25"></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender" value="Male"> Male
                    <input type="radio" name="gender" value="Female"> Female
                </td>
            </tr>
            <tr>
                <td>Course Applied:</td>
                <td>
                    <select name="course">
                        <option value="BCA">BCA</option>
                        <option value="BBA">BBA</option>
                        <option value="B.Com">B.Com</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Date of Birth:</td>
                <td><input type="date" name="dob"></td>
            </tr>
            <tr>
                <td>Address:</td>
                <td><textarea name="address" rows="4" cols="25"></textarea></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <br>
                    <input type="submit" value="Submit Form">
                    <input type="reset" value="Clear Form">
                </td>
            </tr>
        </table>
    </form>

    <p align="center"><br>Shashank Kumar Verma / BCA - (A) / 1rst Sem / CET 196</p>

</body>
</html>
